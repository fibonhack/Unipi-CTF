name: Joker's Revenge
author: marcop

description: The Joker did it again! He sneaked back into the bank and plugged the same weird USB device into one of the computers. He also left a note that reads "You will not find my flag this time! I have encrypted it and without the decryption key not even your Batcomputer can help you!". Can you find out what the Joker did on the computer from the USB traffic capture and retrieve the flag?

