name: Joker's Capture
author: marcop


description: The CCTV of Gotham City International Bank have spotted the Joker plugging a weird device into one of the computers and then doing some suspicious stuff. We don't know what that device was and the police was too late to capture him, but luckily we managed to capture the USB traffic exchanged between the device and the pc. Can you help Batman find the Joker's flag?
